<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fdfaf5">
<title>生日快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { min-height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Songti SC", serif;
    background: #fdfaf5;
    color: #3a332c;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 76px 22px 80px;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(circle at 12% 8%, rgba(232, 196, 148, .22), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(206, 176, 132, .18), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(255, 252, 246, .5), transparent 70%);
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 37px,
      rgba(190, 170, 145, .10) 37px,
      rgba(190, 170, 145, .10) 38px
    );
    opacity: .55;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }

  .candle {
    text-align: center;
    margin-bottom: 26px;
    font-size: 30px;
    line-height: 1;
    animation: flicker 2.6s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: .92; transform: translateY(0) scale(1); }
    50% { opacity: 1; transform: translateY(-3px) scale(1.03); }
  }

  .card {
    background: rgba(255, 255, 255, .72);
    border: 1px solid rgba(198, 172, 136, .28);
    border-radius: 18px;
    padding: 44px 32px 48px;
    box-shadow:
      0 2px 4px rgba(160, 130, 95, .05),
      0 14px 40px rgba(160, 130, 95, .09);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  h1 {
    font-size: 21px;
    font-weight: 500;
    color: #8a6a44;
    letter-spacing: .16em;
    text-align: center;
    margin-bottom: 8px;
  }

  .sub {
    text-align: center;
    font-size: 12.5px;
    color: #b09878;
    letter-spacing: .1em;
    margin-bottom: 30px;
  }

  .rule {
    width: 44px;
    height: 1px;
    background: rgba(198, 172, 136, .45);
    margin: 0 auto 34px;
  }

  p {
    font-size: 16px;
    line-height: 2.1;
    color: #463d33;
    margin-bottom: 22px;
    text-align: justify;
    text-justify: inter-ideograph;
    word-break: break-word;
  }
  p:last-of-type { margin-bottom: 0; }

  .sign {
    margin-top: 38px;
    padding-top: 24px;
    border-top: 1px solid rgba(198, 172, 136, .22);
    text-align: right;
    font-size: 13px;
    color: #a89478;
    letter-spacing: .12em;
    line-height: 1.9;
  }

  .footnote {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: #bcab92;
    letter-spacing: .18em;
    line-height: 2;
  }

  .fade-in { animation: fadeUp .9s cubic-bezier(.22,.8,.3,1) forwards; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    body { padding: 60px 15px 68px; }
    .card { padding: 36px 22px 40px; border-radius: 15px; }
    h1 { font-size: 19px; letter-spacing: .14em; }
    p { font-size: 15.4px; line-height: 2.02; margin-bottom: 20px; }
    .sign { margin-top: 32px; padding-top: 20px; font-size: 12.5px; }
    .candle { font-size: 27px; margin-bottom: 22px; }
  }

  @media (max-width: 360px) {
    p { font-size: 14.8px; line-height: 1.94; }
    .card { padding: 30px 18px 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; opacity: 1; }
    .candle { animation: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="candle">🕯️</div>

  <div class="card">
    <h1>生 日 快 乐</h1>
    <div class="sub">写给今天的你</div>
    <div class="rule"></div>

    <p>生日快乐。</p>

    <p>知道你在备考，学习之余也多留意身体。</p>

    <p>不用给自己太大负担，按自己节奏来就很好。</p>

    <p>祝你一切平安顺遂。</p>

    <div class="sign">
      写在你的生日<br>
      <span id="sign-date"></span>
    </div>
  </div>

  <div class="footnote">
    · 愿你所愿皆成 ·
  </div>
</div>

<script>
(function () {
  var d = new Date();
  var el = document.getElementById('sign-date');
  if (el) el.textContent = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';

  var ps = document.querySelectorAll('.card p, .sign, .footnote');
  ps.forEach(function (p, i) {
    p.style.opacity = '0';
    setTimeout(function () { p.classList.add('fade-in'); }, 200 + i * 280);
  });

  window.scrollTo(0, 0);
})();
</script>

</body>
</html>
